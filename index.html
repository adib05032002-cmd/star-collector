<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة جمع النجوم</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #152238;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffdf5d;
        }
        #game {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background: #263b59;
            border-radius: 15px;
        }
        #star {
            font-size: 65px;
            cursor: pointer;
            margin: 25px;
        }
        button {
            font-size: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: #ffdf5d;
            cursor: pointer;
        }
        #score {
            color: #ffdf5d;
            font-size: 28px;
        }
    </style>
</head>
<body>
    <h1>⭐ لعبة جمع النجوم ⭐</h1>
    <div id="game">
        <p>اضغط على النجمة واجمع أكبر عدد ممكن!</p>
        <p>النقاط: <span id="score">0</span></p>
        <div id="star" onclick="collectStar()">⭐</div>
        <button onclick="collectStar()">اجمع نجمة!</button>
    </div>
    <script>
        let score = 0;
        function collectStar() {
            score++;
            document.getElementById("score").textContent = score;
        }
    </script>
</body>
</html>
